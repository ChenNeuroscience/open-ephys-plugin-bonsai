name: Windows

# Every push builds the plugin and uploads it as a workflow artifact, so branches and PRs get a
# downloadable .dll. Pushes to master also tag the commit and publish a release.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
        mkdir Release && cd Release
        curl -L https://openephys.jfrog.io/artifactory/GUI-binaries/Libraries/open-ephys-lib-v1.0.0.zip --output open-ephys-lib.zip
        unzip open-ephys-lib.zip
      shell: bash
    - name: rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
      shell: bash
    - name: rust tests
      # The window snapshot tests need a GPU and are compared against macOS renders, so they're skipped here.
      run: "cargo test --release --lib -- --skip gui::"
      working-directory: tracker
      shell: bash
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: configure
      run: |
        cd Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
      shell: bash
    - name: build
      run: |
        msbuild Build/INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      shell: cmd
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: open-ephys-plugin-camera
        path: Build/Release/open-ephys-plugin-camera.dll
        if-no-files-found: error
    - name: create and push tag
      id: create_tag
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        TAG_NAME=$(git rev-parse --short HEAD)
        echo "Pushing tag $TAG_NAME"
        git tag $TAG_NAME
        git push origin $TAG_NAME
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
      shell: bash
    - name: release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: ncipollo/release-action@v1
      with:
        artifacts: Build/Release/open-ephys-plugin-camera.dll
        tag: ${{ steps.create_tag.outputs.TAG_NAME }}
